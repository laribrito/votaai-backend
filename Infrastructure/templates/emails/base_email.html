<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #E6E6E6; color: #111111;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #E6E6E6; padding: 40px 16px;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #FFFFFF; border: 1px solid #D0D0D0; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden;">
                    <!-- Header estilo Desktop/Mobile (sem topbar escura) -->
                    <tr>
                        <td align="center" style="background-color: #FFFFFF; padding: 32px 20px 20px 20px; border-bottom: 1px solid #E0E0E0;">
                            <h1 style="color: #111111; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">{{ app_name|default:"Vota ai" }}</h1>
                            <p style="margin: 6px 0 0 0; color: #555555; font-size: 13px; font-weight: 500;">Sistema Eleitoral • Notificação</p>
                        </td>
                    </tr>
                    
                    <!-- Main Body -->
                    <tr>
                        <td style="padding: 36px 30px; line-height: 1.6; font-size: 15px; color: #333333;">
                            {{ message|safe }}
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td align="center" style="background-color: #F0F0F0; padding: 20px 24px; border-top: 1px solid #E0E0E0;">
                            <p style="margin: 0; font-size: 12px; color: #888888; font-weight: 500;">
                                &copy; {% now "Y" %} {{ app_name|default:"Vota ai" }}. Todos os direitos reservados.
                            </p>
                            <p style="margin: 6px 0 0 0; font-size: 11px; color: #888888;">
                                Esta é uma mensagem automática do sistema. Por favor, não responda diretamente a este e-mail.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
